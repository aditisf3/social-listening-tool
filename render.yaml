# Render Blueprint — deploys Signal Desk as a static site.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: signal-desk
    runtime: static
    # No build step: the site is a single static index.html.
    buildCommand: ""
    # Serve the repository root, which contains index.html.
    staticPublishPath: .
