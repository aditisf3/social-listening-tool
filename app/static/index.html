<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Social Listening Tool</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>Social Listening Tool</h1>
    <p class="tagline">Search a keyword across public sources, store results, see sentiment.</p>
  </header>

  <main>
    <section class="panel">
      <form id="search-form">
        <div class="row">
          <input type="text" id="keyword" placeholder="Enter a keyword (e.g. climate)" required />
          <label class="limit">
            Limit
            <input type="number" id="limit" value="25" min="1" max="100" />
          </label>
          <button type="submit" id="search-btn">Collect</button>
        </div>
        <fieldset id="sources">
          <legend>Sources</legend>
          <div id="source-list">Loading sources…</div>
        </fieldset>
      </form>
      <div id="status" class="status"></div>
    </section>

    <section class="panel" id="summary-panel" hidden>
      <h2>Summary</h2>
      <div id="summary"></div>
    </section>

    <section class="panel">
      <div class="results-header">
        <h2>Results</h2>
        <div class="filters">
          <select id="filter-sentiment">
            <option value="">All sentiment</option>
            <option value="positive">Positive</option>
            <option value="neutral">Neutral</option>
            <option value="negative">Negative</option>
          </select>
          <button id="refresh-btn" type="button">Refresh</button>
        </div>
      </div>
      <div id="results">No results yet. Run a search above.</div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
